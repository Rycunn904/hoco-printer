<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header>
      <h1>Photobooth</h1>
      <p>Take three photos and create a 2 × 4 photo strip.</p>
    </header>


    <section class="controls">
      <label>
        Countdown
        <select id="countdown">
          <option value="1">1 second</option>
          <option value="2">2 seconds</option>
          <option value="3" selected>3 seconds</option>
          <option value="5">5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="15">15 seconds</option>
          <option value="30">30 seconds</option>
        </select>
      </label>

      <label class="upload">
        Bottom image
        <input id="imageUpload" type="file" accept="image/*">
      </label>

      <label class="upload">
        Background / Border
        <input id="backgroundUpload" type="file" accept="image/*">
      </label>

      <button id="startButton">Start Photobooth</button>
      <button id="retakeButton" class="secondary" hidden>
        Retake Photos
      </button>
      <button id="printButton" class="secondary" hidden>
        Print 2 × 4
      </button>
    </section>

    <section class="booth">
      <div class="camera-panel">
        <div class="camera-wrap">
          <video id="video" autoplay playsinline muted></video>
          <div id="countdownOverlay" class="countdown-overlay"></div>
        </div>

        <canvas id="canvas" hidden></canvas>

        <p id="status">Camera is starting…</p>
      </div>

      <div class="preview-panel">
        <h2>Preview</h2>

        <div id="strip" class="strip">

          <div class="strip-slot">Photo 1</div>
          <div class="strip-slot">Photo 2</div>
          <div class="strip-slot">Photo 3</div>
          <div class="strip-slot bottom-slot">Your image</div>

          <!--
        This is an actual image instead of a CSS background.
        This makes the border appear in print reliably.
      -->
          <img id="backgroundFrame" class="background-frame" alt="" aria-hidden="true">

        </div>
      </div>
    </section>

    <section class="saved-image">
      <div>
        <h2>Saved images</h2>
        <p id="savedStatus">No images saved.</p>
      </div>

      <div class="saved-actions">
        <button id="clearImageButton" class="danger">
          Clear Bottom Image
        </button>

        <button id="clearBackgroundButton" class="danger">
          Clear Background
        </button>
      </div>
    </section>


  </main>

  <script src="app.js"></script>

</body>

</html>
